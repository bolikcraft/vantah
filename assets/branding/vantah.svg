<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#f4f4f5"/>

  <!-- Шеврон-ферма. Пояса — это плечи V, смещённые на ±5 от осевой линии
       узел(14,14)→вершина(32,44)→узел(50,14); вершина каждого пояса взята
       пересечением смещённых плеч, иначе на изломе вылезает уступ.
       Пояса упираются точно в центры шестерён — ферма выглядит закреплённой,
       а не подложенной под них. Внутренний пояс не доводится до узла (0.10
       длины), чтобы у шестерни не слипались два стержня. -->
  <g fill="none" stroke="#18181b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.71 16.57 L32.00 53.72 L54.29 16.57" stroke-width="5"/>
    <path d="M19.66 13.71 L32.00 34.28 L44.34 13.71" stroke-width="5"/>
    <!-- раскосы: по два на плечо; больше — и решётка слипается уже на 48 px -->
    <path d="M9.71 16.57 L25.83 24.00" stroke-width="4.4"/>
    <path d="M25.83 24.00 L32.00 53.72" stroke-width="4.4"/>
    <path d="M32.00 53.72 L38.17 24.00" stroke-width="4.4"/>
    <path d="M38.17 24.00 L54.29 16.57" stroke-width="4.4"/>
  </g>

  <!-- Узлы-шестерни: 8 зубьев, вершина 9.2 / впадина 6.0, отверстие 2.8.
       Правая провёрнута на полшага относительно левой — пара читается как
       зацепление, а не как два одинаковых штампа. Геометрия посчитана, а не
       нарисована от руки: правки вести пересчётом, не сдвигом отдельных точек.
       Контур, тело залито цветом плитки: под шестернёй сходятся концы поясов
       фермы, и сквозь прозрачную заливку они торчали бы поперёк зубьев.
       Зелёный тут тёмный (#16a34a, а не #22c55e из трея): на светлой плитке
       у трейного контраст ~2.2:1 и тонкий контур в 32 px размывается. -->
  <g fill="#f4f4f5" stroke="#16a34a" stroke-width="2.6" stroke-linejoin="round">
    <path d="M19.99 14.33 L23.09 15.44 L21.44 19.41 L18.47 18.00 L18.00 18.47 L19.41 21.44
             L15.44 23.09 L14.33 19.99 L13.67 19.99 L12.56 23.09 L8.59 21.44 L10.00 18.47
             L9.53 18.00 L6.56 19.41 L4.91 15.44 L8.01 14.33 L8.01 13.67 L4.91 12.56
             L6.56 8.59 L9.53 10.00 L10.00 9.53 L8.59 6.56 L12.56 4.91 L13.67 8.01
             L14.33 8.01 L15.44 4.91 L19.41 6.56 L18.00 9.53 L18.47 10.00 L21.44 8.59
             L23.09 12.56 L19.99 13.67 Z"/>
    <circle cx="14" cy="14" r="2.8" fill="none"/>
    <path d="M55.41 16.60 L57.84 18.81 L54.81 21.84 L52.60 19.41 L51.99 19.66 L52.15 22.95
             L47.85 22.95 L48.01 19.66 L47.40 19.41 L45.19 21.84 L42.16 18.81 L44.59 16.60
             L44.34 15.99 L41.05 16.15 L41.05 11.85 L44.34 12.01 L44.59 11.40 L42.16 9.19
             L45.19 6.16 L47.40 8.59 L48.01 8.34 L47.85 5.05 L52.15 5.05 L51.99 8.34
             L52.60 8.59 L54.81 6.16 L57.84 9.19 L55.41 11.40 L55.66 12.01 L58.95 11.85
             L58.95 16.15 L55.66 15.99 Z"/>
    <circle cx="50" cy="14" r="2.8" fill="none"/>
  </g>
</svg>
